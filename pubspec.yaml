name: reader_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Readers
  pdfrx: ^2.4.7
  flutter_epub_viewer: ^2.0.0

  # File Handling & Storage
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # AI / Secure Storage & Local DB
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0

  # Usage Intelligence & Export
  fl_chart: ^1.1.1
  csv: ^6.0.0
  share_plus: ^13.3.0

  # UI & Typography
  google_fonts: ^8.2.1
  intl: ^0.20.3
  url_launcher: ^6.3.2
  flutter_hooks: ^0.21.3+1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

